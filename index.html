<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            text-align: center;
            margin-bottom: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .file-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        
        .file-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        /* 搜索框样式 */
        .search-container {
            margin-bottom: 20px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* 高亮样式 */
        .highlight {
            background-color: #fff3cd;
            color: #856404;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 500;
        }
        
        /* 无结果提示 */
        .no-results {
            padding: 40px;
            text-align: center;
            color: #666;
            background: #f9f9f9;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .no-results-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #ccc;
        }
        
        /* 目录结构样式 */
        .directory-tree {
            list-style: none;
        }
        
        .tree-item {
            margin: 2px 0;
        }
        
        .tree-item.folder {
            cursor: pointer;
            user-select: none;
        }
        
        .tree-item .item-content {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin: 2px 0;
        }
        
        .tree-item .item-content:hover {
            background: #f0f4ff;
            transform: translateX(2px);
        }
        
        .tree-item.folder:hover .item-content {
            background: #e8ecff;
        }
        
        .tree-item .toggle {
            margin-right: 10px;
            font-size: 14px;
            transition: transform 0.3s ease;
            color: #667eea;
        }
        
        .tree-item .toggle.open {
            transform: rotate(90deg);
        }
        
        .tree-item .icon {
            margin-right: 10px;
            font-size: 16px;
        }
        
        .tree-item .file-link {
            color: #333;
            text-decoration: none;
            flex: 1;
            font-size: 14px;
            transition: color 0.2s ease;
        }
        
        .tree-item .file-link:hover {
            color: #667eea;
            text-decoration: underline;
        }
        
        .tree-item .file-size {
            font-size: 12px;
            color: #999;
            margin-left: 15px;
        }
        
        .tree-children {
            list-style: none;
            margin-left: 25px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        .tree-children.open {
            display: block;
        }
        
        /* 动画效果 */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 文件夹和文件的不同样式 */
        .tree-item.directory .item-content {
            border-left: 3px solid #667eea;
        }
        
        .tree-item.file .item-content {
            border-left: 3px solid #48bb78;
        }
        
        /* 文件类型图标颜色 */
        .tree-item.file[data-type="pdf"] .icon {
            color: #e53e3e;
        }
        
        .tree-item.file[data-type="docx"] .icon {
            color: #3182ce;
        }
        
        .tree-item.file[data-type="mp4"] .icon {
            color: #dd6b20;
        }
        
        .tree-item.file[data-type="jpg"] .icon,
        .tree-item.file[data-type="jpeg"] .icon,
        .tree-item.file[data-type="png"] .icon {
            color: #805ad5;
        }
        
        .tree-item.file[data-type="xlsx"] .icon {
            color: #38a169;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            header {
                padding: 40px 0;
            }
            
            .file-section {
                padding: 20px;
            }
            
            .tree-children {
                margin-left: 15px;
            }
        }
        
        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #666;
        }
        
        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 错误状态 */
        .error {
            padding: 20px;
            background: #ffebee;
            color: #c62828;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的个人博客</h1>
            <p class="subtitle">分享我的文档和学习笔记</p>
        </header>
        
        <section class="file-section">
            <h2>📁 我的文档</h2>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索文件或文件夹...">
            </div>
            <div id="fileList">
                <div class="loading">正在扫描文件目录</div>
            </div>
        </section>
        
        <section class="upload-section">
            <h2>📤 上传新文件</h2>
            <div class="upload-info">
                <h3>上传方法：</h3>
                <p>1. 将文件复制到 <code>files</code> 文件夹中</p>
                <p>2. 重新生成 files.json：</p>
                <code>node generate-file-list.js</code>
                <p>3. 使用Git命令提交更改：</p>
                <code>git add .<br>git commit -m "添加新文件"<br>git push origin master</code>

            </div>
        </section>
        
        <footer>
            <p>&copy; 2026 我的个人博客 | 基于GitHub+Netlify构建</p>
        </footer>
    </div>
    
    <script>
        // 目录扫描和展示功能
        let originalDirectoryTree = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            const fileListElement = document.getElementById('fileList');
            const searchInput = document.getElementById('searchInput');
            
            // 检查是否在本地文件系统中打开
            if (window.location.protocol === 'file:') {
                fileListElement.innerHTML = `
                    <div class="error">
                        <h3>无法直接预览</h3>
                        <p>由于浏览器安全限制，本地直接打开HTML文件时无法扫描目录。</p>
                        <p>请使用以下方法之一：</p>
                        <ol>
                            <li>使用本地HTTP服务器运行：<code>python3 -m http.server 8000</code></li>
                            <li>部署到Netlify或GitHub Pages等静态网站托管服务</li>
                        </ol>
                    </div>
                `;
                return;
            }
            
            // 初始化扫描
            scanDirectory()
                .then(directoryTree => {
                    if (directoryTree.length === 0) {
                        fileListElement.innerHTML = `
                            <div class="error">
                                <h3>未找到文件</h3>
                                <p>files目录为空或无法访问。</p>
                            </div>
                        `;
                        return;
                    }
                    
                    // 保存原始数据
                    originalDirectoryTree = directoryTree;
                    
                    // 构建初始目录树
                    renderDirectoryTree(directoryTree);
                    
                    // 添加搜索事件监听
                    searchInput.addEventListener('input', function(e) {
                        const searchTerm = e.target.value.trim().toLowerCase();
                        if (searchTerm === '') {
                            renderDirectoryTree(originalDirectoryTree);
                        } else {
                            const searchResults = searchInDirectory(originalDirectoryTree, searchTerm);
                            renderDirectoryTree(searchResults);
                        }
                    });
                })
                .catch(error => {
                    fileListElement.innerHTML = `
                        <div class="error">
                            <h3>错误：${error.message}</h3>
                            <p>请确保files.json文件存在且可访问。</p>
                            <p>如果是本地运行，请启动HTTP服务器：<code>python3 -m http.server 8000</code></p>
                        </div>
                    `;
                    console.error('读取文件列表失败:', error);
                });
        });
        
        // 渲染目录树
        function renderDirectoryTree(directoryTree) {
            const fileListElement = document.getElementById('fileList');
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? searchInput.value.trim() : '';
            
            if (directoryTree.length === 0) {
                fileListElement.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3>未找到相关内容</h3>
                        <p>请尝试使用其他关键词搜索</p>
                    </div>
                `;
                return;
            }
            
            fileListElement.innerHTML = '';
            const treeElement = buildDirectoryTree(directoryTree, 'files', !!searchTerm);
            fileListElement.appendChild(treeElement);
        }
        
        // 搜索目录
        function searchInDirectory(items, searchTerm) {
            const results = [];
            
            items.forEach(item => {
                if (item.type === 'directory') {
                    // 检查目录名是否匹配
                    if (item.name.toLowerCase().includes(searchTerm)) {
                        // 如果目录名匹配，包含整个目录
                        results.push(item);
                    } else {
                        // 否则搜索子目录
                        const matchingChildren = searchInDirectory(item.children, searchTerm);
                        if (matchingChildren.length > 0) {
                            // 如果子目录有匹配项，保留该目录
                            const directoryWithMatches = {...item, children: matchingChildren};
                            results.push(directoryWithMatches);
                        }
                    }
                } else if (item.type === 'file') {
                    // 检查文件名是否匹配
                    if (item.name.toLowerCase().includes(searchTerm)) {
                        results.push(item);
                    }
                }
            });
            
            return results;
        }
        
        // 从files.json读取目录结构
        async function scanDirectory() {
            try {
                const response = await fetch('./files.json');
                
                if (!response.ok) {
                    throw new Error('无法加载文件列表');
                }
                
                const data = await response.json();
                
                // 转换数据格式以匹配原有结构
                const convertData = (items) => {
                    return items.map(item => {
                        if (item.type === 'folder') {
                            return {
                                name: item.name,
                                path: `files/${item.path}`,
                                type: 'directory',
                                children: convertData(item.children)
                            };
                        } else {
                            return {
                                name: item.name,
                                path: `files/${item.path}`,
                                type: 'file',
                                extension: item.ext.substring(1) // 移除点号
                            };
                        }
                    });
                };
                
                const convertedData = convertData(data);
                
                // 过滤掉DS_Store文件
                const filteredData = convertedData.filter(item => {
                    if (item.type === 'file' && item.name === '.DS_Store') {
                        return false;
                    }
                    return true;
                });
                
                // 按名称排序，目录在前，并且按照数字顺序排序（如第1天、第2天）
                filteredData.sort((a, b) => {
                    if (a.type === 'directory' && b.type === 'file') return -1;
                    if (a.type === 'file' && b.type === 'directory') return 1;
                    
                    // 处理"第X天"这样的命名格式，按数字排序
                    const aMatch = a.name.match(/^第(\d+)天/);
                    const bMatch = b.name.match(/^第(\d+)天/);
                    
                    if (aMatch && bMatch) {
                        return parseInt(aMatch[1]) - parseInt(bMatch[1]);
                    } else if (aMatch) {
                        return -1;
                    } else if (bMatch) {
                        return 1;
                    } else {
                        return a.name.localeCompare(b.name);
                    }
                });
                
                return filteredData;
            } catch (error) {
                console.error('读取文件列表失败:', error);
                return [];
            }
        }
        
        // 构建目录树
        function buildDirectoryTree(items, basePath, autoExpand = false) {
            const ul = document.createElement('ul');
            ul.className = 'directory-tree';
            
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = `tree-item ${item.type}`;
                
                const itemContent = document.createElement('div');
                itemContent.className = 'item-content';
                
                if (item.type === 'directory') {
                    // 目录项
                    const toggle = document.createElement('span');
                    toggle.className = 'toggle';
                    toggle.textContent = '▶';
                    itemContent.appendChild(toggle);
                    
                    const icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = '📁';
                    itemContent.appendChild(icon);
                    
                    const name = document.createElement('span');
                    name.innerHTML = highlightText(item.name);
                    itemContent.appendChild(name);
                    
                    li.appendChild(itemContent);
                    
                    // 子目录
                    const childrenUl = buildDirectoryTree(item.children, item.path, autoExpand);
                    childrenUl.className = 'tree-children';
                    li.appendChild(childrenUl);
                    
                    // 自动展开目录（仅在搜索时）
                    if (childrenUl.children.length > 0) {
                        if (autoExpand) {
                            toggle.classList.add('open');
                            childrenUl.classList.add('open');
                        }
                        
                        // 为目录添加点击事件
                        itemContent.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggle.classList.toggle('open');
                            childrenUl.classList.toggle('open');
                        });
                    } else {
                        // 如果没有子目录，隐藏展开图标
                        toggle.style.display = 'none';
                    }
                } else {
                    // 文件项
                    const icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = getFileIcon(item.extension);
                    itemContent.appendChild(icon);
                    
                    const link = document.createElement('a');
                    link.className = 'file-link';
                    link.href = item.path;
                    link.target = '_blank';
                    link.innerHTML = highlightText(item.name);
                    itemContent.appendChild(link);
                    
                    // 添加文件类型数据属性，用于样式应用
                    li.setAttribute('data-type', item.extension);
                    
                    li.appendChild(itemContent);
                }
                
                ul.appendChild(li);
            });
            
            return ul;
        }
        
        // 高亮文本
        function highlightText(text) {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? searchInput.value.trim() : '';
            
            if (!searchTerm) {
                return text;
            }
            
            const regex = new RegExp(`(${searchTerm})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }
        
        // 获取文件图标
        function getFileIcon(extension) {
            const icons = {
                'pdf': '📄',
                'docx': '📃',
                'doc': '📃',
                'xlsx': '📊',
                'xls': '📊',
                'mp4': '🎬',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'zip': '📦'
            };
            return icons[extension] || '📄';
        }
        
        // 添加目录展开/折叠功能
        function addToggleFunctionality() {
            const folderItems = document.querySelectorAll('.tree-item.folder');
            
            folderItems.forEach(folder => {
                const itemContent = folder.querySelector('.item-content');
                const toggle = folder.querySelector('.toggle');
                const children = folder.querySelector('.tree-children');
                
                if (itemContent && toggle && children) {
                    // 确保子目录存在时才添加点击事件
                    if (children.children.length > 0) {
                        itemContent.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggle.classList.toggle('open');
                            children.classList.toggle('open');
                        });
                    } else {
                        // 如果没有子目录，隐藏展开图标
                        toggle.style.display = 'none';
                    }
                }
            });
        }
    </script>
</body>
</html>
