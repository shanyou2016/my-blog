<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            text-align: center;
            margin-bottom: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .file-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        
        .file-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        /* 目录结构样式 */
        .directory-tree {
            list-style: none;
        }
        
        .tree-item {
            margin: 5px 0;
        }
        
        .tree-item.folder {
            cursor: pointer;
            user-select: none;
        }
        
        .tree-item.folder:hover {
            color: #667eea;
        }
        
        .tree-item .item-content {
            display: flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        
        .tree-item .item-content:hover {
            background: #f0f0f0;
        }
        
        .tree-item .toggle {
            margin-right: 8px;
            font-size: 12px;
            transition: transform 0.2s ease;
        }
        
        .tree-item .toggle.open {
            transform: rotate(90deg);
        }
        
        .tree-item .icon {
            margin-right: 8px;
            font-size: 14px;
        }
        
        .tree-item .file-link {
            color: #333;
            text-decoration: none;
            flex: 1;
        }
        
        .tree-item .file-link:hover {
            color: #667eea;
            text-decoration: underline;
        }
        
        .tree-item .file-size {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }
        
        .tree-children {
            list-style: none;
            margin-left: 20px;
            display: none;
        }
        
        .tree-children.open {
            display: block;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            header {
                padding: 40px 0;
            }
            
            .file-section {
                padding: 20px;
            }
            
            .tree-children {
                margin-left: 15px;
            }
        }
        
        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #666;
        }
        
        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 错误状态 */
        .error {
            padding: 20px;
            background: #ffebee;
            color: #c62828;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的个人博客</h1>
            <p class="subtitle">分享我的文档和学习笔记</p>
        </header>
        
        <section class="file-section">
            <h2>📁 我的文档</h2>
            <div id="fileList">
                <div class="loading">正在扫描文件目录</div>
            </div>
        </section>
        
        <section class="upload-section">
            <h2>📤 上传新文件</h2>
            <div class="upload-info">
                <h3>上传方法：</h3>
                <p>1. 将文件复制到 <code>files</code> 文件夹中</p>
                <p>2. 使用Git命令提交更改：</p>
                <code>git add .<br>git commit -m "添加新文件"<br>git push origin master</code>
                <p>3. 刷新Gitee Pages服务</p>
            </div>
        </section>
        
        <footer>
            <p>&copy; 2026 我的个人博客 | 基于Gitee Pages构建</p>
        </footer>
    </div>
    
    <script>
        // 目录扫描和展示功能
        document.addEventListener('DOMContentLoaded', function() {
            const fileListElement = document.getElementById('fileList');
            
            // 检查是否在本地文件系统中打开
            if (window.location.protocol === 'file:') {
                fileListElement.innerHTML = `
                    <div class="error">
                        <h3>无法直接预览</h3>
                        <p>由于浏览器安全限制，本地直接打开HTML文件时无法扫描目录。</p>
                        <p>请使用以下方法之一：</p>
                        <ol>
                            <li>使用本地HTTP服务器运行：<code>python3 -m http.server 8000</code></li>
                            <li>部署到Netlify或GitHub Pages等静态网站托管服务</li>
                        </ol>
                    </div>
                `;
                return;
            }
            
            // 初始化扫描
            scanDirectory('files')
                .then(directoryTree => {
                    if (directoryTree.length === 0) {
                        fileListElement.innerHTML = `
                            <div class="error">
                                <h3>未找到文件</h3>
                                <p>files目录为空或无法访问。</p>
                            </div>
                        `;
                        return;
                    }
                    
                    fileListElement.innerHTML = '';
                    const treeElement = buildDirectoryTree(directoryTree, 'files');
                    fileListElement.appendChild(treeElement);
                })
                .catch(error => {
                    fileListElement.innerHTML = `
                        <div class="error">
                            <h3>错误：${error.message}</h3>
                            <p>请确保files目录存在且可访问。</p>
                            <p>如果是本地运行，请启动HTTP服务器：<code>python3 -m http.server 8000</code></p>
                        </div>
                    `;
                    console.error('扫描目录失败:', error);
                });
        });
        
        // 扫描目录
        async function scanDirectory(path) {
            try {
                const response = await fetch(path);
                
                if (!response.ok) {
                    throw new Error(`无法访问目录: ${path}`);
                }
                
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                const items = [];
                const links = doc.querySelectorAll('a');
                
                for (const link of links) {
                    const href = link.getAttribute('href');
                    if (!href || href.startsWith('?') || href === '../') continue;
                    
                    const name = link.textContent.trim();
                    if (!name) continue;
                    
                    const itemPath = `${path}/${href}`.replace('//', '/');
                    
                    if (href.endsWith('/')) {
                        // 是目录
                        const directory = {
                            name: name.replace('/', ''),
                            path: itemPath,
                            type: 'directory',
                            children: await scanDirectory(itemPath)
                        };
                        items.push(directory);
                    } else {
                        // 是文件
                        const file = {
                            name: name,
                            path: itemPath,
                            type: 'file',
                            extension: getFileExtension(name)
                        };
                        items.push(file);
                    }
                }
                
                // 按名称排序，目录在前
                items.sort((a, b) => {
                    if (a.type === 'directory' && b.type === 'file') return -1;
                    if (a.type === 'file' && b.type === 'directory') return 1;
                    return a.name.localeCompare(b.name);
                });
                
                return items;
            } catch (error) {
                console.error(`扫描目录 ${path} 失败:`, error);
                return [];
            }
        }
        
        // 获取文件扩展名
        function getFileExtension(filename) {
            const parts = filename.split('.');
            return parts.length > 1 ? parts[parts.length - 1].toLowerCase() : '';
        }
        
        // 构建目录树
        function buildDirectoryTree(items, basePath) {
            const ul = document.createElement('ul');
            ul.className = 'directory-tree';
            
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = `tree-item ${item.type}`;
                
                const itemContent = document.createElement('div');
                itemContent.className = 'item-content';
                
                if (item.type === 'directory') {
                    // 目录项
                    const toggle = document.createElement('span');
                    toggle.className = 'toggle';
                    toggle.textContent = '▶';
                    itemContent.appendChild(toggle);
                    
                    const icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = '📁';
                    itemContent.appendChild(icon);
                    
                    const name = document.createElement('span');
                    name.textContent = item.name;
                    itemContent.appendChild(name);
                    
                    li.appendChild(itemContent);
                    
                    // 子目录
                    const childrenUl = buildDirectoryTree(item.children, item.path);
                    childrenUl.className = 'tree-children';
                    li.appendChild(childrenUl);
                    
                    // 为目录添加点击事件
                    if (childrenUl.children.length > 0) {
                        itemContent.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggle.classList.toggle('open');
                            childrenUl.classList.toggle('open');
                        });
                    } else {
                        // 如果没有子目录，隐藏展开图标
                        toggle.style.display = 'none';
                    }
                } else {
                    // 文件项
                    const icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = getFileIcon(item.extension);
                    itemContent.appendChild(icon);
                    
                    const link = document.createElement('a');
                    link.className = 'file-link';
                    link.href = item.path;
                    link.target = '_blank';
                    link.textContent = item.name;
                    itemContent.appendChild(link);
                    
                    li.appendChild(itemContent);
                }
                
                ul.appendChild(li);
            });
            
            return ul;
        }
        
        // 获取文件图标
        function getFileIcon(extension) {
            const icons = {
                'pdf': '📄',
                'docx': '📃',
                'doc': '📃',
                'xlsx': '📊',
                'xls': '📊',
                'mp4': '🎬',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'zip': '📦'
            };
            return icons[extension] || '📄';
        }
        
        // 添加目录展开/折叠功能
        function addToggleFunctionality() {
            const folderItems = document.querySelectorAll('.tree-item.folder');
            
            folderItems.forEach(folder => {
                const itemContent = folder.querySelector('.item-content');
                const toggle = folder.querySelector('.toggle');
                const children = folder.querySelector('.tree-children');
                
                if (itemContent && toggle && children) {
                    // 确保子目录存在时才添加点击事件
                    if (children.children.length > 0) {
                        itemContent.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggle.classList.toggle('open');
                            children.classList.toggle('open');
                        });
                    } else {
                        // 如果没有子目录，隐藏展开图标
                        toggle.style.display = 'none';
                    }
                }
            });
        }
    </script>
</body>
</html>
