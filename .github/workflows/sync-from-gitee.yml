name: Sync from Gitee

# Gitee 为主仓：本地只推 Gitee，本 workflow 定时把 Gitee 内容同步到 GitHub，
# Netlify 监听 GitHub push 自动部署。
on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟检查一次
  workflow_dispatch:          # 支持在 GitHub 页面手动触发

permissions:
  contents: write

concurrency:
  group: sync-from-gitee
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config user.name "gitee-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$GITEE_TOKEN" ]; then
            GITEE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/shanzihao/my-blog.git"
          else
            GITEE_URL="https://gitee.com/shanzihao/my-blog.git"
          fi
          git remote add gitee "$GITEE_URL"
          git fetch gitee main
          git reset --hard gitee/main
          git push --force origin main
